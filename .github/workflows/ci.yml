# NLSB CI (Phase 10). Two independent jobs; a red in either fails the run.
# No job needs a real ANTHROPIC_API_KEY: the suites use fake LLM clients
# throughout, tests needing live network are marked `live` and deselected
# here, and the 8B live smoke script (tests/smoke_injection_live.py) is
# double-gated (non-test_* filename + NLSB_RUN_LIVE_SMOKE env skip) so it
# can never run in CI.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt

      - name: Install dependencies (pinned)
        run: pip install -r requirements.txt -c requirements.lock.txt

      - name: Run tests (network-dependent `live` tests deselected)
        run: pytest -m "not live"

  frontend:
    name: frontend (vitest, tsc, eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit & integration tests
        run: npx vitest run

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
